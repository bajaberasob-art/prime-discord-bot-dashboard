[project]
name = "python-discord-bot"
version = "0.1.0"
description = "A starter Discord bot built with Python and discord.py"
requires-python = ">=3.11"
dependencies = [
    "discord.py==2.7.1",
    "aiosqlite>=0.19.0",
    "multidict>=6.9.1",
    "Pillow>=12.2.0",
    "fontstack==0.3.8",
    "fonttools>=4.62.1",
    "pilmoji>=2.0.5",
    "arabic-reshaper>=3.0.0",
    "python-bidi>=0.6.7",
]
